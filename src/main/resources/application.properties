# ============================================
# SEUIL DE PERTINENCE RAG (anti-bruit documentaire)
# ============================================
# Distance cosinus maximale acceptee pour injecter un chunk dans le contexte.
# 0 = identique, 2 = totalement different. 0.55 est un bon point de depart,
# a ajuster selon vos tests reels (regardez rag-queries.log pour calibrer).
app.rag.max-distance-threshold=0.55


# ============================================
# HIKARICP - Fiabilite de connexion avec Supabase Pooler
# ============================================
# Teste la connexion avant de la reutiliser (evite de reutiliser une connexion
# morte cote reseau/Supabase sans le savoir)
spring.datasource.hikari.connection-test-query=SELECT 1
# Duree de vie max d'une connexion en pool (30 min) : force un renouvellement
# regulier plutot que de garder une connexion ouverte indefiniment
spring.datasource.hikari.max-lifetime=1800000
# Temps d'inactivite avant qu'une connexion soit consideree "idle" et fermee
spring.datasource.hikari.idle-timeout=600000
# Delai max d'attente pour obtenir une connexion du pool
spring.datasource.hikari.connection-timeout=30000
# Validation de la connexion avant utilisation (timeout court)
spring.datasource.hikari.validation-timeout=5000
# Nombre de connexions minimum maintenues en pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10