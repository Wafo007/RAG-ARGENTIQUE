# ============================================
# APPLICATION
# ============================================
spring.application.name=RAG

# ============================================
# BASE DE DONNÉES POSTGRESQL CLOUD (SUPABASE)
# ============================================
# NOUVELLE URL avec Session Pooler (IPv4)
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.lhxshgbbdthybujhdhwt
spring.datasource.password=MonSuperMdP123!
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# CONFIGURATION MISTRAL AI
# ============================================
spring.ai.mistralai.api-key=9dQOmdg7LWXZJ5EhPZZBkOO2JaRM3gup
spring.ai.mistralai.chat.options.model=mistral-medium
spring.ai.mistralai.chat.options.temperature=0.7
spring.ai.mistralai.embedding.options.model=mistral-embed

# ============================================
# SERVEUR
# ============================================
server.port=8087

# ============================================
# LOGGING
# ============================================
logging.level.com.Cervarent.RAG=DEBUG
logging.level.org.springframework.ai=DEBUG

# ============================================
# UPLOAD DE FICHIERS
# ============================================
# Taille max d'un fichier : 20 Mo
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Activer le traitement asynchrone de Spring
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100


# ============================================
# SUPABASE STORAGE (fichiers originaux : PDF/DOCX/TXT/images)
# ============================================
# URL de base du projet Supabase (SANS slash final), ex: https://xxxx.supabase.co
supabase.url=https://lhxshgbbdthybujhdhwt.supabase.co
# Cle "service_role" (PAS la cle anon) : necessaire pour ecrire/lire dans un
# bucket prive depuis le backend. A recuperer dans Supabase > Project Settings > API.
# IMPORTANT : ne jamais exposer cette cle au frontend.
supabase.service-role-key=sb_secret_o94SRWX4Hi5ofQJj-Lr7dA_1s5Wn2EN
# Nom du bucket de stockage des documents originaux (a creer une fois dans
# Supabase > Storage > New bucket). Peut rester "prive" : le backend sert les
# fichiers via des URLs signees temporaires, jamais via l'URL publique brute.
supabase.storage.bucket=documents
# Duree de validite (en secondes) des URLs signees generees pour le
# telechargement/la previsualisation depuis le frontend (1h par defaut).
supabase.storage.signed-url-expiry-seconds=3600

# ============================================
# JWT
# ============================================
# Clé secrète pour signer les tokens (a remplacer par une variable d'environnement en prod)
app.jwt.secret=changeMoiEnVariableEnvironnementCarTropSensibleIciEnClairXYZ123456789
# Duree de vie du token en millisecondes (24h)
app.jwt.expiration-ms=86400000

# ============================================
# SEUIL DE PERTINENCE RAG (anti-bruit documentaire)
# ============================================
# Distance cosinus maximale acceptee pour injecter un chunk dans le contexte.
# 0 = identique, 2 = totalement different. 0.55 est un bon point de depart,
# a ajuster selon vos tests reels (regardez rag-queries.log pour calibrer).
app.rag.max-distance-threshold=0.55


# ============================================
# HIKARICP - Fiabilite de connexion avec Supabase Pooler
# ============================================
# Teste la connexion avant de la reutiliser (evite de reutiliser une connexion
# morte cote reseau/Supabase sans le savoir)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5


server.port=${PORT:8080}